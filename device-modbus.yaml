  - space: input
    address: 32
    title: "Pre-heater State"
    description: >-
      Pre-heater diagnostics. Meaningful only on units where the pre-heater
      option is fitted.
    clear_label: "OK"
    fields:
      - { bit: 0, property: preheater_fault }
      - { bit: 1, property: preheater_thermal_cutout_open }
      - { bit: 2, property: preheater_output_saturated }
      - { bit: 3, property: preheater_frost_protection_active }

  - space: input
    address: 41
    fields: [ { property: bypass_position, encoding: uint16 } ]

  - space: input
    address: 42
    title: "Bypass State"
    description: >-
      Bypass damper diagnostics, including the two conditions under which the
      unit holds the damper closed regardless of the control mode.
    clear_label: "OK"
    fields:
      - { bit: 0, property: bypass_damper_fault }
      - { bit: 1, property: bypass_position_feedback_missing }
      - { bit: 2, property: bypass_held_closed_by_frost_protection }
      - { bit: 3, property: bypass_held_closed_by_missing_temperature }

  - space: input
    address: 51
    fields: [ { property: filter_elapsed_time, encoding: uint16 } ]

  - space: input
    address: 52
    fields: [ { property: filter_differential_pressure, encoding: uint16 } ]

  - space: input
    address: 53
    title: "Filter State"
    description: >-
      Filter condition as judged by the selected monitoring mode.
    clear_label: "OK"
    fields:
      - { bit: 0, property: filter_replacement_due }
      - { bit: 1, property: filter_replacement_overdue }
      - { bit: 2, property: filter_pressure_sensor_fault }

  - space: input
