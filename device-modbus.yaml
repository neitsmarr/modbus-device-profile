# yaml-language-server: $schema=device-modbus.schema.json
#
# THE MODBUS INTERFACE OF ONE DEVICE, ENTIRE. There is no second document: which
# device this is, how a client recognises it, which exceptions it raises, what
# the transport tolerates, every address space it exposes and every commissioning
# procedure it supports are all here.
#
# An address space is an entity: it owns the numbering its registers are written
# in and the registers themselves (D20). A register is an entity: it owns its
# address, its name, its prose and its access. A field is an entity: it owns one
# value's identifier, how the wire carries it, and what that value means --
# unit, scale, range, default, enum members and the conditions under which it is
# present, valid or writable (D21). That is what lets one register carry eight
# bools, one property span two registers, and a range be reserved carrying
# nothing at all.
#
# A field's `id` is that value's only name, and exists for one reason: so that an
# expression or a procedure can refer to another value without hardcoding its
# address, which would break the moment the map is renumbered. The
# reverse-dependency index of D1 is built from those references, and the firmware
# X-macro pastes the same token.
#
# What is stated and what is derived:
#   - `access` IS stated on every holding and coil register. The specification
#     characterises holding registers as read-write but guarantees nothing per
#     address -- it leaves the mapping onto device memory to the vendor -- so a
#     read-only or write-only holding register conforms and a client cannot
#     discover which by probing. An input register needs none: FC 4 fixes it.
#   - `encoding` IS stated, always, even though the obvious width is right 178
#     times out of 190: derived from a range, widening that range would silently
#     change the wire format (D16).
#   - `type` IS stated. It looks derivable from the presence of enum, labels or
#     scale, and that derivation is exact here and wrong the moment a device
#     sends a genuine float32, which carries no scale.
#   - what sort of thing a field is -- setting, measurement or command -- is NOT
#     stated. It follows from the space and the access, which was measured to
#     agree with the declared value in all 277 cases.
#
# ASSUMPTIONS, all needing confirmation against firmware:
#   - every address here is invented; only the layout style is borrowed from
#     the company library
#   - blocks: HR1-19 interfaces, HR21-39 unit, HR101-155 chains, HR201-330
#     sensor channels 20 apart, HR990 reset; input registers mirror it
#   - gaps_readable and the word limits are guesses
#   - unoccupied ranges are not marked: whether a gap is reserved for future
#     use or merely unassigned is a firmware fact, and 23 holding ranges are
#     currently unaccounted for
#   - the identification rules below assume device_type reads 4010 and that
#     firmware 1.x packs major/minor as one byte each
#   - FC 43 support, and its conformity level, are assumed rather than
#     confirmed; a device that omits it is identified by the register probes
#   - every exception below is assumed, including that an out-of-range write is
#     rejected rather than clamped, and both proprietary codes are invented:
#     the numbers 0x41 and 0x42 need confirming against firmware
#   - a reheater is not modelled; only the pre-heater was confirmed
#   - the client interface is modelled as configuration only; the remote
#     registers it polls belong to another device's profile, not this one

device:
  vendor: "3S"
  model: AHU-1
  description: "Residential air handling unit with heat recovery"
  type: 4010
  firmware_version:
    from: "1.0"

identification:
  read_device_id:
    vendor_name: "3S"
    product_code: AHU-1
    conformity_level: 1
  registers:
    - space: holding
      address: 4
      equals: 4010
    - space: holding
      address: 6
      mask: 65280
      equals: 256

exceptions:
  - code: 2
    name: "Illegal Data Address"
    description: >-
      An address in no documented block. Unoccupied addresses inside the
      documented blocks are readable and return zero, per
      limits.gaps_readable.
  - code: 3
    name: "Illegal Data Value"
    description: >-
      A written value outside the range declared for the register. The
      device rejects the whole request rather than clamping, so a
      partially valid multi-register write applies nothing.
  - code: 4
    name: "Server Device Failure"
    description: >-
      The write reached non-volatile memory and the commit failed. The
      value in RAM may already have changed, so re-read before retrying.
  - code: 6
    name: "Server Device Busy"
    description: >-
      A sensor bus rescan or a factory reset is in progress. Reads of
      cached values continue to succeed; writes are refused until it
      finishes.
    retryable: true
  - code: 65
    name: "Setting Locked In Current Mode"
    description: >-
      The register is writable in principle but not in the mode the unit
      is in -- writing the ventilation level while the operating mode is
      not manual, for instance. Change the governing setting first;
      retrying unchanged will fail identically.
    retryable: false
  - code: 66
    name: "Value Rejected By Dependent Setting"
    description: >-
      The value is inside its own range but inconsistent with a related
      register: a minimum output above its maximum, or an alert 1 level
      above alert 2. Nothing is written, and the conflicting register has
      to move first or move in the same request.
    retryable: false

limits:
  supported_fc:
    - 3
    - 4
    - 6
    - 16
    - 43
  max_read_words: 32
  max_write_words: 16
  gaps_readable: true
  turnaround_ms: 5

spaces:

  holding:
    base: 1
    registers:

      - address: 1
        title: "Device Slave Address"
        access: read_write
        fields:
          - id: server_slave_address
            encoding: uint16
            type: int
            range: [1, 247]
            default: 1

      - address: 2
        title: "Modbus Baud Rate"
        access: read_write
        fields:
          - id: server_baud_rate
            encoding: uint16
            type: enum
            unit: bps
            default: b19200
            enum: { 0: b4800, 1: b9600, 2: b19200, 3: b38400, 4: b57600, 5: b115200 }

      - address: 3
        title: "Modbus Parity"
        access: read_write
        fields:
          - id: server_parity
            encoding: uint16
            type: enum
            default: even_8e1
            enum: { 0: none_8n1, 1: even_8e1, 2: odd_8o1 }

      - address: 4
        title: "Device Type"
        access: read_only
        fields:
          - id: device_type
            encoding: uint16
            type: int

      - address: 5
        title: "Hardware Version"
        access: read_only
        fields:
          - id: hardware_version
            encoding: uint16
            type: int
            display: version

      - address: 6
        title: "Firmware Version"
        access: read_only
        fields:
          - id: firmware_version
            encoding: uint16
            type: int
            display: version

      - address: 9
        title: "Network Bus Termination Resistor"
        access: read_write
        fields:
          - id: server_termination_resistor
            encoding: uint16
            type: bool
            default: disconnected
            labels: { false: disconnected, true: connected }

      - address: 10
        title: "Modbus Registers Reset"
        access: write_only
        fields:
          - id: modbus_registers_reset
            encoding: uint16
            type: bool
            default: idle
            labels: { false: idle, true: reset }

      - address: 11
        title: "Client Interface Enable"
        access: read_write
        fields:
          - id: client_enable
            encoding: uint16
            type: bool
            default: disabled
            labels: { false: disabled, true: enabled }
            on_write:
              reread: dependents
              settle_ms: 200

      - address: 12
        title: "Client Baud Rate"
        access: read_write
        fields:
          - id: client_baud_rate
            encoding: uint16
            type: enum
            unit: bps
            default: b19200
            enum: { 0: b4800, 1: b9600, 2: b19200, 3: b38400, 4: b57600, 5: b115200 }
            present_when: "client_enable == enabled"

      - address: 13
        title: "Client Parity"
        access: read_write
        fields:
          - id: client_parity
            encoding: uint16
            type: enum
            default: even_8e1
            enum: { 0: none_8n1, 1: even_8e1, 2: odd_8o1 }
            present_when: "client_enable == enabled"

      - address: 14
        title: "Client Poll Interval"
        access: read_write
        fields:
          - id: client_poll_interval
            encoding: uint16
            type: int
            unit: ms
            range: [100, 10000]
            step: 100
            default: 1000
            present_when: "client_enable == enabled"

      - address: 15
        title: "Client Response Timeout"
        access: read_write
        fields:
          - id: client_response_timeout
            encoding: uint16
            type: int
            unit: ms
            range: [50, 5000]
            default: 500
            present_when: "client_enable == enabled"

      - address: 16
        title: "Client Retry Count"
        access: read_write
        fields:
          - id: client_retry_count
            encoding: uint16
            type: int
            range: [0, 5]
            default: 2
            present_when: "client_enable == enabled"

      - address: 21
        title: "Left-Right Swap"
        description: >-
          Exchanges which physical side each air chain drives. Every
          chain and channel reading elsewhere in this map is reported
          in logical (supply / extract) terms, so nothing is
          conditional on this setting -- the mapping happens in
          firmware. Changing it after installation invalidates the
          commissioned duct and sensor layout; use the
          swap_air_chains procedure.
        access: read_write
        fields:
          - id: left_right_swap
            encoding: uint16
            type: bool
            default: normal
            labels: { false: normal, true: swapped }
            on_write:
              settle_ms: 1000

      - address: 22
        title: "Operating Mode"
        access: read_write
        fields:
          - id: operating_mode
            encoding: uint16
            type: enum
            default: automatic
            enum: { 0: standby, 1: manual, 2: automatic, 3: boost, 4: away }
            on_write:
              reread: dependents
              settle_ms: 500

      - address: 23
        title: "Ventilation Level"
        access: read_write
        fields:
          - id: ventilation_level
            encoding: uint16
            type: int
            unit: "%"
            range: [0, 100]
            step: 5
            default: 50
            writable_when: "operating_mode == manual"

      - address: 24
        title: "Carbon Dioxide Setpoint"
        access: read_write
        fields:
          - id: co2_setpoint
            encoding: uint16
            type: int
            unit: ppm
            range: [600, 1500]
            step: 50
            default: 900
            present_when: "operating_mode == automatic"

      - address: 25
        title: "Relative Humidity Setpoint"
        access: read_write
        fields:
          - id: humidity_setpoint
            encoding: uint16
            type: int
            unit: "%RH"
            range: [30, 70]
            default: 55
            present_when: "operating_mode == automatic"

      - address: 26
        title: "Modbus Safety Timeout"
        description: >-
          How long the server interface may stay silent before the
          unit falls back to automatic operation. Zero disables the
          fallback, leaving the unit in whatever mode a client last
          wrote.
        access: read_write
        fields:
          - id: modbus_safety_timeout
            encoding: uint16
            type: int
            unit: minutes
            range: [0, 240]
            default: 0

      - address: 27
        title: "Sensor Bus Rescan"
        access: write_only
        fields:
          - id: sensor_bus_rescan
            encoding: uint16
            type: bool
            default: idle
            labels: { false: idle, true: rescan }

      - address: 31
        title: "Outdoor Air Temperature Source"
        access: read_write
        fields:
          - id: outdoor_air_temperature_source
            encoding: uint16
            type: enum
            default: none
            enum: { 0: none, 1: supply_ch1, 2: supply_ch2, 3: supply_ch3, 4: extract_ch1, 5: extract_ch2, 6: extract_ch3 }
            on_write:
              reread: dependents
              settle_ms: 500

      - address: 32
        title: "Supply Air Temperature Source"
        access: read_write
        fields:
          - id: supply_air_temperature_source
            encoding: uint16
            type: enum
            default: none
            enum: { 0: none, 1: supply_ch1, 2: supply_ch2, 3: supply_ch3, 4: extract_ch1, 5: extract_ch2, 6: extract_ch3 }
            on_write:
              reread: dependents
              settle_ms: 500

      - address: 33
        title: "Extract Air Temperature Source"
        access: read_write
        fields:
          - id: extract_air_temperature_source
            encoding: uint16
            type: enum
            default: none
            enum: { 0: none, 1: supply_ch1, 2: supply_ch2, 3: supply_ch3, 4: extract_ch1, 5: extract_ch2, 6: extract_ch3 }
            on_write:
              reread: dependents
              settle_ms: 500

      - address: 34
        title: "Exhaust Air Temperature Source"
        access: read_write
        fields:
          - id: exhaust_air_temperature_source
            encoding: uint16
            type: enum
            default: none
            enum: { 0: none, 1: supply_ch1, 2: supply_ch2, 3: supply_ch3, 4: extract_ch1, 5: extract_ch2, 6: extract_ch3 }
            on_write:
              reread: dependents
              settle_ms: 500

      - address: 41
        title: "Pre-heater Installed"
        description: >-
          Whether the pre-heater option is fitted. Every other pre-
          heater register is absent on a unit without it, rather than
          present and idle, so this is the first thing a
          commissioning tool should establish.
        access: read_write
        fields:
          - id: preheater_installed
            encoding: uint16
            type: bool
            default: not_installed
            labels: { false: not_installed, true: installed }
            on_write:
              reread: dependents
              settle_ms: 500

      - address: 42
        title: "Pre-heater Control Mode"
        access: read_write
        fields:
          - id: preheater_control_mode
            encoding: uint16
            type: enum
            default: frost_protection
            enum: { 0: disabled, 1: frost_protection, 2: supply_temperature }
            present_when: "preheater_installed == installed"
            on_write:
              reread: dependents

      - address: 43
        title: "Pre-heater Output Type"
        access: read_write
        fields:
          - id: preheater_output_type
            encoding: uint16
            type: enum
            default: v0_10
            enum: { 0: v0_10, 1: ma0_20, 2: pwm_12v, 3: pwm_open_collector }
            present_when: "preheater_installed == installed"

      - address: 44
        title: "Pre-heater Minimum Output Value"
        access: read_write
        fields:
          - id: preheater_minimum_output_value
            encoding: uint16
            type: int
            unit: "%"
            range: [0, 50]
            default: 0
            present_when: "preheater_installed == installed"

      - address: 45
        title: "Pre-heater Maximum Output Value"
        access: read_write
        fields:
          - id: preheater_maximum_output_value
            encoding: uint16
            type: int
            unit: "%"
            range: [50, 100]
            default: 100
            present_when: "preheater_installed == installed"

      - address: 46
        title: "Pre-heater Frost Protection Setpoint"
        access: read_write
        fields:
          - id: preheater_frost_protection_setpoint
            encoding: int16
            type: real
            unit: "°C"
            scale: 0.1
            decimals: 1
            range: [-20.0, 5.0]
            default: -3.0
            present_when: "preheater_control_mode == frost_protection"

      - address: 47
        title: "Pre-heater Supply Temperature Setpoint"
        access: read_write
        fields:
          - id: preheater_supply_temperature_setpoint
            encoding: int16
            type: real
            unit: "°C"
            scale: 0.1
            decimals: 1
            range: [5.0, 25.0]
            default: 16.0
            present_when: "preheater_control_mode == supply_temperature"

      - address: 51
        title: "Bypass Control Mode"
        access: read_write
        fields:
          - id: bypass_control_mode
            encoding: uint16
            type: enum
            default: automatic
            enum: { 0: disabled, 1: automatic, 2: manual }
            on_write:
              reread: dependents
              settle_ms: 500

      - address: 52
        title: "Bypass Output Type"
        access: read_write
        fields:
          - id: bypass_output_type
            encoding: uint16
            type: enum
            default: v0_10
            enum: { 0: v0_10, 1: ma0_20, 2: pwm_12v, 3: pwm_open_collector }
            present_when: "bypass_control_mode != disabled"

      - address: 53
        title: "Bypass Minimum Output Value"
        description: >-
          The damper's closed end stop, as a percentage of the analog
          output. Raising it above zero trims a damper that does not
          fully seat.
        access: read_write
        fields:
          - id: bypass_minimum_output_value
            encoding: uint16
            type: int
            unit: "%"
            range: [0, 40]
            default: 0
            present_when: "bypass_control_mode != disabled"

      - address: 54
        title: "Bypass Maximum Output Value"
        access: read_write
        fields:
          - id: bypass_maximum_output_value
            encoding: uint16
            type: int
            unit: "%"
            range: [60, 100]
            default: 100
            present_when: "bypass_control_mode != disabled"

      - address: 55
        title: "Bypass Outdoor Temperature Threshold"
        access: read_write
        fields:
          - id: bypass_outdoor_temperature_threshold
            encoding: int16
            type: real
            unit: "°C"
            scale: 0.1
            decimals: 1
            range: [10.0, 30.0]
            default: 18.0
            present_when: "bypass_control_mode == automatic"

      - address: 56
        title: "Bypass Extract Temperature Threshold"
        access: read_write
        fields:
          - id: bypass_extract_temperature_threshold
            encoding: int16
            type: real
            unit: "°C"
            scale: 0.1
            decimals: 1
            range: [18.0, 30.0]
            default: 22.0
            present_when: "bypass_control_mode == automatic"

      - address: 57
        title: "Bypass Manual Position"
        access: read_write
        fields:
          - id: bypass_manual_position
            encoding: uint16
            type: int
            unit: "%"
            range: [0, 100]
            step: 5
            default: 0
            present_when: "bypass_control_mode == manual"

      - address: 61
        title: "Filter Monitoring Mode"
        access: read_write
        fields:
          - id: filter_monitoring_mode
            encoding: uint16
            type: enum
            default: elapsed_time
            enum: { 0: disabled, 1: elapsed_time, 2: differential_pressure }
            on_write:
              reread: dependents
              settle_ms: 500

      - address: 62
        title: "Filter Replacement Interval"
        access: read_write
        fields:
          - id: filter_replacement_interval
            encoding: uint16
            type: int
            unit: days
            range: [30, 365]
            default: 90
            present_when: "filter_monitoring_mode == elapsed_time"

      - address: 63
        title: "Filter Differential Pressure Threshold"
        access: read_write
        fields:
          - id: filter_differential_pressure_threshold
            encoding: uint16
            type: int
            unit: Pa
            range: [50, 500]
            default: 200
            present_when: "filter_monitoring_mode == differential_pressure"

      - address: 64
        title: "Filter Counter Reset"
        access: write_only
        fields:
          - id: filter_counter_reset
            encoding: uint16
            type: bool
            default: idle
            labels: { false: idle, true: reset }
            present_when: "filter_monitoring_mode == elapsed_time"

      - address: 101
        title: "Supply Fan Control Source"
        access: read_write
        fields:
          - id: supply_fan_control_source
            encoding: uint16
            type: enum
            default: analog_output
            enum: { 0: analog_output, 1: modbus }
            on_write:
              reread: dependents
              settle_ms: 500

      - address: 102
        title: "Supply Fan Analog Output Type"
        access: read_write
        fields:
          - id: supply_fan_analog_output_type
            encoding: uint16
            type: enum
            default: v0_10
            enum: { 0: v0_10, 1: ma0_20, 2: pwm_12v, 3: pwm_open_collector }
            present_when: "supply_fan_control_source == analog_output"

      - address: 103
        title: "Supply Fan Minimum Output Value"
        access: read_write
        fields:
          - id: supply_fan_minimum_output_value
            encoding: uint16
            type: int
            unit: "%"
            range: [20, 60]
            default: 30

      - address: 104
        title: "Supply Fan Maximum Output Value"
        access: read_write
        fields:
          - id: supply_fan_maximum_output_value
            encoding: uint16
            type: int
            unit: "%"
            range: [60, 100]
            default: 100

      - address: 105
        title: "Supply Fan Start Output Value"
        access: read_write
        fields:
          - id: supply_fan_start_output_value
            encoding: uint16
            type: int
            unit: "%"
            range: [20, 100]
            default: 50

      - address: 106
        title: "Supply Fan Kickstart Control"
        access: read_write
        fields:
          - id: supply_fan_kickstart_control
            encoding: uint16
            type: enum
            default: softstart
            enum: { 0: softstart, 1: kickstart }

      - address: 107
        title: "Supply Fan Kickstart Time"
        access: read_write
        fields:
          - id: supply_fan_kickstart_time
            encoding: uint16
            type: int
            unit: seconds
            range: [2, 10]
            default: 5
            present_when: "supply_fan_kickstart_control == kickstart"

      - address: 108
        title: "Supply Fan Modbus Slave Address"
        access: read_write
        fields:
          - id: supply_fan_modbus_slave_address
            encoding: uint16
            type: int
            range: [1, 247]
            default: 1
            present_when: "supply_fan_control_source == modbus"

      - address: 109
        title: "Supply Fan Modbus Speed Register"
        access: read_write
        fields:
          - id: supply_fan_modbus_speed_register
            encoding: uint16
            type: int
            range: [1, 65535]
            present_when: "supply_fan_control_source == modbus"

      - address: 110
        title: "Supply Fan Overwrite Enable"
        access: read_write
        fields:
          - id: supply_fan_overwrite_enable
            encoding: uint16
            type: bool
            default: automatic
            labels: { false: automatic, true: overwrite }
            on_write:
              reread: dependents

      - address: 111
        title: "Supply Fan Overwrite Value"
        access: read_write
        fields:
          - id: supply_fan_overwrite_value
            encoding: uint16
            type: int
            unit: "%"
            range: [0, 100]
            default: 50
            present_when: "supply_fan_overwrite_enable == overwrite"

      - address: 116
        title: "Supply Digital Input Function"
        access: read_write
        fields:
          - id: supply_digital_input_function
            encoding: uint16
            type: enum
            default: disabled
            enum: { 0: disabled, 1: boost, 2: away, 3: external_fault, 4: filter_switch }
            on_write:
              reread: dependents

      - address: 117
        title: "Supply Digital Input Polarity"
        access: read_write
        fields:
          - id: supply_digital_input_polarity
            encoding: uint16
            type: bool
            default: normally_open
            labels: { false: normally_open, true: normally_closed }
            present_when: "supply_digital_input_function != disabled"

      - address: 131
        title: "Extract Fan Control Source"
        access: read_write
        fields:
          - id: extract_fan_control_source
            encoding: uint16
            type: enum
            default: analog_output
            enum: { 0: analog_output, 1: modbus }
            on_write:
              reread: dependents
              settle_ms: 500

      - address: 132
        title: "Extract Fan Analog Output Type"
        access: read_write
        fields:
          - id: extract_fan_analog_output_type
            encoding: uint16
            type: enum
            default: v0_10
            enum: { 0: v0_10, 1: ma0_20, 2: pwm_12v, 3: pwm_open_collector }
            present_when: "extract_fan_control_source == analog_output"

      - address: 133
        title: "Extract Fan Minimum Output Value"
        access: read_write
        fields:
          - id: extract_fan_minimum_output_value
            encoding: uint16
            type: int
            unit: "%"
            range: [20, 60]
            default: 30

      - address: 134
        title: "Extract Fan Maximum Output Value"
        access: read_write
        fields:
          - id: extract_fan_maximum_output_value
            encoding: uint16
            type: int
            unit: "%"
            range: [60, 100]
            default: 100

      - address: 135
        title: "Extract Fan Start Output Value"
        access: read_write
        fields:
          - id: extract_fan_start_output_value
            encoding: uint16
            type: int
            unit: "%"
            range: [20, 100]
            default: 50

      - address: 136
        title: "Extract Fan Kickstart Control"
        access: read_write
        fields:
          - id: extract_fan_kickstart_control
            encoding: uint16
            type: enum
            default: softstart
            enum: { 0: softstart, 1: kickstart }

      - address: 137
        title: "Extract Fan Kickstart Time"
