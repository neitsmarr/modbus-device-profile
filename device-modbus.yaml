# yaml-language-server: $schema=device-modbus.schema.json
#
# PROTOCOL LAYER: the Modbus register map. A register is an entity here, not
# an attribute of a property: it owns its address, its name, its prose and its
# access, and its fields say which properties it carries. That is what lets one
# register carry eight bools, one property span two registers, and a range be
# reserved with no property at all -- none of which a per-property binding
# could express (D15).
#
# Properties are referenced by name from device-properties.yaml.
#
# A register carries only what cannot be derived. Its access is NOT stated: it
# follows from the properties it carries, and may be narrowed here only to say
# that the bus offers less than the property allows. Its encoding IS stated,
# always, even though the obvious width is right 178 times out of 190 -- if it
# were derived from a range, widening that range in the semantic document would
# silently change the wire format (D16).
#
# ASSUMPTIONS, all needing confirmation against firmware:
#   - every address here is invented; only the layout style is borrowed from
#     the company library
#   - blocks: HR1-19 interfaces, HR21-39 unit, HR101-155 chains, HR201-330
#     sensor channels 20 apart, HR990 reset; input registers mirror it
#   - gaps_readable and the word limits are guesses
#   - unoccupied ranges are not marked: whether a gap is reserved for future
#     use or merely unassigned is a firmware fact, and 23 holding ranges are
#     currently unaccounted for

limits:
  supported_fc: [3, 4, 6, 16]
  max_read_words: 32
  max_write_words: 16
  gaps_readable: true
  turnaround_ms: 5

registers:

  # ------------------------- holding registers -------------------------

