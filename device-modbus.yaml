  input:
    base: 1
    registers:

      - address: 1
        title: "Device Status - Errors"
        description: >-
          Fault conditions that stop normal operation. Any bit set
          here is reflected in application_state.
        clear_label: OK
        fields:
          - id: error_supply_voltage_fault
            bit: 0
            type: bool
            title: "Device Status - Errors: Supply Voltage Fault"
          - id: error_internal_voltage_fault
            bit: 1
            type: bool
            title: "Device Status - Errors: Internal Voltage Fault"
          - id: error_memory_fault
            bit: 2
            type: bool
            title: "Device Status - Errors: Memory Fault"
          - id: error_supply_fan_fault
            bit: 3
            type: bool
            title: "Device Status - Errors: Supply Fan Fault"
          - id: error_extract_fan_fault
            bit: 4
            type: bool
            title: "Device Status - Errors: Extract Fan Fault"
          - id: error_sensor_bus_fault
            bit: 5
            type: bool
            title: "Device Status - Errors: Sensor Bus Fault"
          - id: error_preheater_fault
            bit: 6
            type: bool
            title: "Device Status - Errors: Preheater Fault"
          - id: error_bypass_fault
            bit: 7
            type: bool
