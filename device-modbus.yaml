  # ------------------------- input registers -------------------------

  - space: input
    address: 1
    title: "Device Status - Errors"
    description: >-
      Fault conditions that stop normal operation. Any bit set here is
      reflected in application_state.
    clear_label: "OK"
    fields:
      - { bit: 0, property: error_supply_voltage_fault }
      - { bit: 1, property: error_internal_voltage_fault }
      - { bit: 2, property: error_memory_fault }
      - { bit: 3, property: error_supply_fan_fault }
      - { bit: 4, property: error_extract_fan_fault }
      - { bit: 5, property: error_sensor_bus_fault }
      - { bit: 6, property: error_preheater_fault }
      - { bit: 7, property: error_bypass_fault }

  - space: input
    address: 2
    title: "Device Status - Warnings"
    description: >-
      Conditions that degrade operation or need attention but do not stop
      ventilation.
    clear_label: "OK"
    fields:
      - { bit: 0, property: warning_supply_voltage_warning }
      - { bit: 1, property: warning_internal_voltage_warning }
      - { bit: 2, property: warning_sensor_replacement_due }
      - { bit: 3, property: warning_client_interface_degraded }
      - { bit: 4, property: warning_filter_replacement_due }
      - { bit: 5, property: warning_efficiency_below_expected }

