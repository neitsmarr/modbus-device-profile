      - address: 202
        title: "Supply Channel 1 - Sensor State"
        description: >-
          Condition of the sensor module on supply channel 1. Its readings are
          only trustworthy while none of these bits is set.
        clear_label: "OK"
        fields:
          - { bit: 0, property: supply_ch1_sensor_problem }
          - { bit: 1, property: supply_ch1_sensor_replacement }
          - { bit: 2, property: supply_ch1_sensor_preheating }
