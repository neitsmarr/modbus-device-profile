# yaml-language-server: $schema=device-modbus.schema.json
#
# PROTOCOL LAYER: the Modbus register map. An address space is an entity here,
# and owns the numbering its registers are written in and the registers
# themselves. A register is an entity too: it owns its address, its name, its
# prose and its access, and its fields say which properties it carries. That is
# what lets one register carry eight bools, one property span two registers, and
# a range be reserved with no property at all -- none of which a per-property
# binding could express (D15).
#
# Properties are referenced by name from device-properties.yaml.
#
# A register carries only what cannot be derived. Its access is NOT stated: it
# follows from the properties it carries, and may be narrowed here only to say
# that the bus offers less than the property allows. Its encoding IS stated,
# always, even though the obvious width is right 178 times out of 190 -- if it
# were derived from a range, widening that range in the semantic document would
# silently change the wire format (D16).
#
# This document is meant to stand on its own: which device it describes, how
# each space numbers its addresses, how a client recognises it on the bus, and
# what the transport tolerates are all stated here rather than assumed. That is what
# makes it usable for a third-party product, where there is no semantic
# document and no firmware source to fall back on.
#
# ASSUMPTIONS, all needing confirmation against firmware:
#   - every address here is invented; only the layout style is borrowed from
#     the company library
#   - blocks: HR1-19 interfaces, HR21-39 unit, HR101-155 chains, HR201-330
#     sensor channels 20 apart, HR990 reset; input registers mirror it
#   - gaps_readable and the word limits are guesses
#   - unoccupied ranges are not marked: whether a gap is reserved for future
#     use or merely unassigned is a firmware fact, and 23 holding ranges are
#     currently unaccounted for
#   - the identification rules below assume device_type reads 4010 and that
#     firmware 1.x packs major/minor as one byte each
#   - FC 43 support, and its conformity level, are assumed rather than
#     confirmed; a device that omits it is identified by the register probes
#   - every exception below is assumed, including that an out-of-range write is
#     rejected rather than clamped, and both proprietary codes are invented:
#     the numbers 0x41 and 0x42 need confirming against firmware

device:
  vendor: "3S"
  model: "AHU-1"
  description: "Residential air handling unit with heat recovery"
  type: 4010                  # placeholder series id
  firmware_version:
    from: "1.0"               # no 'to': this map holds for 1.0 and later


# How a client confirms that whatever answered at some slave address is this
# device. Read-only, and every rule must hold; a rule that cannot be read at all
# counts as a mismatch, because the thing being probed may be some other
# vendor's product entirely.
#
# Read Device Identification (FC 43, MEI 14) comes first where it answers, since
# it asks the device what it is without presuming any register map and so cannot
# misread an address that means something else there. The register probes narrow
# that result, and stand in for it entirely on the many devices lacking FC 43.
identification:
  read_device_id:
    vendor_name: "3S"
    product_code: "AHU-1"
    conformity_level: 1
  registers:
    - { space: holding, address: 4, equals: 4010 }     # device_type
    - { space: holding, address: 6, mask: 0xFF00, equals: 0x0100 }  # firmware major 1

# Which exception codes come back, and what this device means by each. Every
# entry carries a short `name` for inline display and a `description` for the
# full story, standard codes included, so a tool never needs a table of its own
# to render a failure. `overloads` is the separate warning that a standard code
# does NOT mean what the specification says here.
#
# The two proprietary codes exist because the standard has no way to express
# "the register is real and writable, just not right now", which is exactly what
# a mode-dependent or interlocked setting has to report.
exceptions:
  - code: 0x02
    name: "Illegal Data Address"
    description: >-
      An address in no documented block. Unoccupied addresses inside the
      documented blocks are readable and return zero, per limits.gaps_readable.
  - code: 0x03
    name: "Illegal Data Value"
    description: >-
      A written value outside the range declared for the register. The device
      rejects the whole request rather than clamping, so a partially valid
      multi-register write applies nothing.
  - code: 0x04
    name: "Server Device Failure"
    description: >-
      The write reached non-volatile memory and the commit failed. The value in
      RAM may already have changed, so re-read before retrying.
  - code: 0x06
    name: "Server Device Busy"
    description: >-
      A sensor bus rescan or a factory reset is in progress. Reads of cached
      values continue to succeed; writes are refused until it finishes.
    retryable: true
  - code: 0x41
    name: "Setting Locked In Current Mode"
    description: >-
      The register is writable in principle but not in the mode the unit is in
      -- writing the ventilation level while the operating mode is not manual,
      for instance. Change the governing setting first; retrying unchanged will
      fail identically.
    retryable: false
  - code: 0x42
    name: "Value Rejected By Dependent Setting"
    description: >-
      The value is inside its own range but inconsistent with a related
      register: a minimum output above its maximum, or an alert 1 level above
      alert 2. Nothing is written, and the conflicting register has to move
      first or move in the same request.
    retryable: false

limits:
  supported_fc: [3, 4, 6, 16, 43]
  max_read_words: 32
  max_write_words: 16
  gaps_readable: true
  turnaround_ms: 5

# Each space states the address it would write for wire offset 0, so
# offset = address - base. Write 1 for the register numbers a datasheet prints,
# 0 to write raw offsets, or 40001 / 30001 to transcribe a legacy map exactly as
# printed. Stating it is the whole point: the same file read under the other
# convention is silently off by one everywhere.
spaces:

  holding:
    base: 1
    registers:

      - address: 1
        fields: [ { property: server_slave_address, encoding: uint16 } ]

      - address: 2
        fields: [ { property: server_baud_rate, encoding: uint16 } ]

      - address: 3
        fields: [ { property: server_parity, encoding: uint16 } ]

