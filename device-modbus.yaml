    title: "Supply Fan State"
    description: >-
      Fault and diagnostic bits for the supply fan channel, whichever control
      source is selected.
    clear_label: "OK"
    fields:
      - { bit: 0, property: supply_fan_fault }
      - { bit: 1, property: supply_fan_tacho_missing }
      - { bit: 2, property: supply_fan_modbus_timeout }
      - { bit: 3, property: supply_fan_blocked_rotor }

