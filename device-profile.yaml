    access: read_only
    unit: "VDC"
    scale: 0.01
    decimals: 2

  device_reset:
    title: "Device Reset"
    kind: command
    type: bool
    binding: { holding: 990, encoding: uint16 }
    access: write_only
    labels: { false: idle, true: reset }
    default: idle

procedures:

  swap_air_chains:
    title: "Swap air chains left to right"
    danger: high
    confirm: "Both fans stop and the unit reverses which physical side is
      supply and which is extract. Ducting, sensors and the digital inputs
      must be re-checked against the new orientation before restarting."
    duration_ms: 5000
    preconditions:
      - operating_mode == standby
      - supply_fan_speed == 0
      - extract_fan_speed == 0
    steps:
      - write: { signal: left_right_swap, value: $param.orientation }
        verify:
          read: left_right_swap
          equals: $param.orientation
          timeout_ms: 2000
      - delay_ms: 1000
      - reread: [supply_digital_input_state, extract_digital_input_state]
    on_failure:
      - write: { signal: operating_mode, value: standby }
    outcome:
      failure: { signal: error_sensor_bus_fault, equals: true }
    params:
      orientation: { enum_from: left_right_swap }

  set_fan_control_source:
    title: "Change fan control source"
    danger: high
    confirm: "The fan stops while the control path changes. An EC fan left on
      the wrong path will not run at all."
    duration_ms: 3000
    preconditions:
      - operating_mode == standby
    steps:
      - write: { signal: supply_fan_control_source, value: $param.source }
        verify:
          read: supply_fan_control_source
          equals: $param.source
          timeout_ms: 1000
      - write: { signal: extract_fan_control_source, value: $param.source }
        verify:
          read: extract_fan_control_source
          equals: $param.source
          timeout_ms: 1000
      - delay_ms: 500
    params:
      source: { enum_from: supply_fan_control_source }

  rescan_sensor_channels:
    title: "Rescan I2C sensor channels"
    danger: medium
    confirm: "Sensor readings are unavailable during the scan. Channels that
      have been physically removed lose their configuration."
    duration_ms: 10000
    steps:
      - write: { signal: sensor_bus_rescan, value: rescan }
      - await:
          signal: sensor_bus_state
          in: [complete, failed]
          timeout_ms: 15000
          poll_ms: 500
      - reread:
          - supply_ch1_provides_temperature
          - supply_ch1_provides_carbon_dioxide
          - supply_ch2_provides_temperature
          - supply_ch2_provides_carbon_dioxide
          - supply_ch3_provides_temperature
          - supply_ch3_provides_carbon_dioxide
          - extract_ch1_provides_temperature
          - extract_ch1_provides_carbon_dioxide
          - extract_ch2_provides_temperature
          - extract_ch2_provides_carbon_dioxide
          - extract_ch3_provides_temperature
          - extract_ch3_provides_carbon_dioxide
    outcome:
      success: { signal: sensor_bus_state, equals: complete }
      failure: { signal: sensor_bus_state, equals: failed }

  commission_fan_limits:
    title: "Set fan output limits"
    danger: medium
    confirm: "Minimum output below the fan's stall threshold will stall it
      instead of running it slowly."
    preconditions:
      - operating_mode == standby
    steps:
      - write: { signal: supply_fan_minimum_output_value, value: $param.minimum }
      - write: { signal: supply_fan_maximum_output_value, value: $param.maximum }
      - write: { signal: extract_fan_minimum_output_value, value: $param.minimum }
      - write: { signal: extract_fan_maximum_output_value, value: $param.maximum }
    params:
      minimum: { type: int, range: [20, 60], default: 30, title: "Minimum output" }
      maximum: { type: int, range: [60, 100], default: 100, title: "Maximum output" }

  assign_air_path_temperatures:
    title: "Assign air path temperature sources"
    danger: medium
    confirm: "Heat recovery efficiency, automatic bypass and pre-heater control
      all read these. A source pointing at a channel with no temperature sensor
      disables them silently."
    preconditions:
      - operating_mode == standby
    steps:
      - write: { signal: outdoor_air_temperature_source, value: $param.outdoor }
      - write: { signal: supply_air_temperature_source, value: $param.supply }
      - write: { signal: extract_air_temperature_source, value: $param.extract }
      - write: { signal: exhaust_air_temperature_source, value: $param.exhaust }
      - delay_ms: 500
      - reread:
          - outdoor_air_temperature
          - supply_air_temperature
          - extract_air_temperature
          - exhaust_air_temperature
          - heat_recovery_efficiency
    params:
      outdoor: { enum_from: outdoor_air_temperature_source }
      supply: { enum_from: supply_air_temperature_source }
      extract: { enum_from: extract_air_temperature_source }
      exhaust: { enum_from: exhaust_air_temperature_source }

  reset_filter_counter:
    title: "Reset filter counter"
    danger: low
    confirm: "Only do this when the filters have actually been replaced."
    steps:
      - write: { signal: filter_counter_reset, value: reset }
      - delay_ms: 500
      - reread:
          - filter_elapsed_time
          - filter_replacement_due
          - filter_replacement_overdue
    outcome:
      success: { signal: filter_replacement_due, equals: false }
