# yaml-language-server: $schema=device-profile.schema.json
#
# Residential air handling unit: two air chains, one EC fan per chain, up to
# three I2C sensor channels per chain, one auxiliary digital input per chain,
# a Modbus server interface and a Modbus client interface.
#
# Naming and value conventions follow the company device library
# (3SModbus/DeviceLibrary): '<Measurand> Level', '<Measurand> Correction
# Value', 'Minimum/Maximum Output Value', 'Sensor State' as a bit field,
# 'Alerts' as OK / Yellow / Red, and the HR1-HR10 common block.
#
# ASSUMPTIONS, all needing confirmation against firmware:
#   - every address below is invented; only the layout style is borrowed
#   - address blocks: HR1-19 interfaces, HR21-39 unit, HR101-155 chains,
#     HR201-330 sensor channels (20 apart), HR990 reset; IR mirrors it
#   - bypass, preheater/reheater, heat-recovery and filter monitoring are
#     NOT modelled: they were not in the hardware list, though a residential
#     AHU normally has them
#   - the client interface is modelled as configuration only; the polled
#     remote registers it reads are a separate profile, not this one

device:
  name: "AHU-1"
  description: "Residential air handling unit with heat recovery"
  type: 4010                  # placeholder series id
  firmware_version: "1.0"

access:
  supported_fc: [3, 4, 6, 16]
  max_read_words: 32
  max_write_words: 16
  gaps_readable: true         # ASSUMPTION: blocks span unmapped addresses safely
  turnaround_ms: 5

signals:

  # ---------------------------------------------------------------------
  # Modbus server interface and device identity (HR1-HR10 common block)
  # ---------------------------------------------------------------------

  server_slave_address:
    title: "Device Slave Address"
    kind: setting
    type: int
    binding: { holding: 1, encoding: uint16 }
    range: [1, 247]
    default: 1

  server_baud_rate:
    title: "Modbus Baud Rate"
    kind: setting
    type: enum
    binding: { holding: 2, encoding: uint16 }
    unit: "bps"
    enum: { 0: b4800, 1: b9600, 2: b19200, 3: b38400, 4: b57600, 5: b115200 }
    default: b19200

  server_parity:
    title: "Modbus Parity"
    kind: setting
    type: enum
    binding: { holding: 3, encoding: uint16 }
    enum: { 0: none_8n1, 1: even_8e1, 2: odd_8o1 }
    default: even_8e1

  device_type:
    title: "Device Type"
    kind: measurement
    type: int
    binding: { holding: 4, encoding: uint16 }
    access: read_only

  hardware_version:
    title: "Hardware Version"
    kind: measurement
    type: int
    display: version
    binding: { holding: 5, encoding: uint16 }
    access: read_only
    # packed BCD-style bytes in the library format; see the open formatting
    # question in DECISIONS.md D6

  firmware_version:
    title: "Firmware Version"
    kind: measurement
    type: int
    display: version
    binding: { holding: 6, encoding: uint16 }
    access: read_only

  server_termination_resistor:
    title: "Network Bus Termination Resistor"
    kind: setting
    type: bool
    binding: { holding: 9, encoding: uint16 }
    labels: { false: disconnected, true: connected }
    default: disconnected

  modbus_registers_reset:
    title: "Modbus Registers Reset"
    kind: command
    type: bool
    binding: { holding: 10, encoding: uint16 }
    access: write_only
    labels: { false: idle, true: reset }
    default: idle

  # ---------------------------------------------------------------------
  # Modbus client interface -- the AHU polling its own peripherals
  # ---------------------------------------------------------------------

  client_enable:
    title: "Client Interface Enable"
    kind: setting
    type: bool
    binding: { holding: 11, encoding: uint16 }
    labels: { false: disabled, true: enabled }
    default: disabled
    on_write:
      reread: dependents
      settle_ms: 200

  client_baud_rate:
    title: "Client Baud Rate"
    kind: setting
    type: enum
    binding: { holding: 12, encoding: uint16 }
    unit: "bps"
    enum: { 0: b4800, 1: b9600, 2: b19200, 3: b38400, 4: b57600, 5: b115200 }
    default: b19200
    present_when: client_enable == enabled

  client_parity:
    title: "Client Parity"
    kind: setting
    type: enum
    binding: { holding: 13, encoding: uint16 }
    enum: { 0: none_8n1, 1: even_8e1, 2: odd_8o1 }
    default: even_8e1
    present_when: client_enable == enabled

  client_poll_interval:
    title: "Client Poll Interval"
    kind: setting
    type: int
    binding: { holding: 14, encoding: uint16 }
    unit: "ms"
    range: [100, 10000]
    step: 100
    default: 1000
    present_when: client_enable == enabled

  client_response_timeout:
    title: "Client Response Timeout"
    kind: setting
    type: int
    binding: { holding: 15, encoding: uint16 }
    unit: "ms"
    range: [50, 5000]
    default: 500
    present_when: client_enable == enabled

  client_retry_count:
    title: "Client Retry Count"
    kind: setting
    type: int
    binding: { holding: 16, encoding: uint16 }
    range: [0, 5]
    default: 2
    present_when: client_enable == enabled

  client_state:
    title: "Client Interface State"
    kind: measurement
    type: enum
    binding: { input: 11, encoding: uint16 }
    access: read_only
    enum: { 0: idle, 1: polling, 2: degraded, 3: bus_fault }
    valid_when: client_enable == enabled

  # ---------------------------------------------------------------------
  # Unit-level configuration and state
  # ---------------------------------------------------------------------

  left_right_swap:
    title: "Left-Right Swap"
    kind: setting
    type: bool
    binding: { holding: 21, encoding: uint16 }
    labels: { false: normal, true: swapped }
    default: normal
    # Exchanges which physical side each air chain drives. Every chain and
    # channel reading below is reported in logical (supply/extract) terms, so
    # nothing here is conditional on it -- the mapping happens in firmware.
    # It is still a commissioning-critical write: see swap_air_chains.
    on_write:
      settle_ms: 1000

  operating_mode:
    title: "Operating Mode"
    kind: setting
    type: enum
    binding: { holding: 22, encoding: uint16 }
    enum: { 0: standby, 1: manual, 2: automatic, 3: boost, 4: away }
    default: automatic
    on_write:
      reread: dependents
      settle_ms: 500

  ventilation_level:
    title: "Ventilation Level"
    kind: setting
    type: int
    binding: { holding: 23, encoding: uint16 }
    unit: "%"
    range: [0, 100]
    step: 5
    default: 50
    writable_when: operating_mode == manual

  co2_setpoint:
    title: "Carbon Dioxide Setpoint"
    kind: setting
    type: int
    binding: { holding: 24, encoding: uint16 }
    unit: "ppm"
    range: [600, 1500]
    step: 50
    default: 900
    present_when: operating_mode == automatic

  humidity_setpoint:
    title: "Relative Humidity Setpoint"
    kind: setting
    type: int
    binding: { holding: 25, encoding: uint16 }
    unit: "%RH"
    range: [30, 70]
    default: 55
    present_when: operating_mode == automatic

  modbus_safety_timeout:
    title: "Modbus Safety Timeout"
    kind: setting
    type: int
    binding: { holding: 26, encoding: uint16 }
    unit: "minutes"
    range: [0, 240]
    default: 0
    # 0 disables the fallback; any other value returns the unit to
    # automatic when the server interface goes quiet that long.

  sensor_bus_rescan:
    title: "Sensor Bus Rescan"
    kind: command
    type: bool
    binding: { holding: 27, encoding: uint16 }
    access: write_only
    labels: { false: idle, true: rescan }
    default: idle

  sensor_bus_state:
    title: "Sensor Bus State"
    kind: measurement
    type: enum
    binding: { input: 13, encoding: uint16 }
    access: read_only
    enum: { 0: idle, 1: scanning, 2: complete, 3: failed }

  error_supply_voltage_fault:
    title: "Device Status - Errors: Supply Voltage Fault"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 1, encoding: bit, bit: 0 }
    bitfield: "Device Status - Errors"

  error_internal_voltage_fault:
    title: "Device Status - Errors: Internal Voltage Fault"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 1, encoding: bit, bit: 1 }
    bitfield: "Device Status - Errors"

  error_memory_fault:
    title: "Device Status - Errors: Memory Fault"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 1, encoding: bit, bit: 2 }
    bitfield: "Device Status - Errors"

  error_supply_fan_fault:
    title: "Device Status - Errors: Supply Fan Fault"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 1, encoding: bit, bit: 3 }
    bitfield: "Device Status - Errors"

  error_extract_fan_fault:
    title: "Device Status - Errors: Extract Fan Fault"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 1, encoding: bit, bit: 4 }
    bitfield: "Device Status - Errors"

  error_sensor_bus_fault:
    title: "Device Status - Errors: Sensor Bus Fault"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 1, encoding: bit, bit: 5 }
    bitfield: "Device Status - Errors"

  error_preheater_fault:
    title: "Device Status - Errors: Preheater Fault"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 1, encoding: bit, bit: 6 }
    bitfield: "Device Status - Errors"

  error_bypass_fault:
    title: "Device Status - Errors: Bypass Fault"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 1, encoding: bit, bit: 7 }
    bitfield: "Device Status - Errors"

  warning_supply_voltage_warning:
    title: "Device Status - Warnings: Supply Voltage Warning"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 2, encoding: bit, bit: 0 }
    bitfield: "Device Status - Warnings"

  warning_internal_voltage_warning:
    title: "Device Status - Warnings: Internal Voltage Warning"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 2, encoding: bit, bit: 1 }
    bitfield: "Device Status - Warnings"

  warning_sensor_replacement_due:
    title: "Device Status - Warnings: Sensor Replacement Due"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 2, encoding: bit, bit: 2 }
    bitfield: "Device Status - Warnings"

  warning_client_interface_degraded:
    title: "Device Status - Warnings: Client Interface Degraded"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 2, encoding: bit, bit: 3 }
    bitfield: "Device Status - Warnings"

  warning_filter_replacement_due:
    title: "Device Status - Warnings: Filter Replacement Due"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 2, encoding: bit, bit: 4 }
    bitfield: "Device Status - Warnings"

  warning_efficiency_below_expected:
    title: "Device Status - Warnings: Efficiency Below Expected"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 2, encoding: bit, bit: 5 }
    bitfield: "Device Status - Warnings"

  supply_voltage:
    title: "Supply Voltage"
    kind: measurement
    type: real
    binding: { input: 3, encoding: uint16 }
    access: read_only
    unit: "VDC"
    scale: 0.1
    decimals: 1

  application_state:
    title: "Application State"
    kind: measurement
    type: enum
    binding: { input: 12, encoding: uint16 }
    access: read_only
    enum: { 0: idle, 1: ventilating, 2: boosting, 3: away, 4: fault }

  # ---------------------------------------------------------------------
  # Air path temperatures and heat recovery efficiency
  #
  # A sensor channel knows what it can measure but not where it sits in the
  # air path, and efficiency needs to know. Rather than assign roles to
  # channels -- which would need a quantifier over channels, and D5 rules
  # that out -- each air path point names its source channel, following the
  # library's "Output N Source" pattern.
  # ---------------------------------------------------------------------
  outdoor_air_temperature_source:
    title: "Outdoor Air Temperature Source"
    kind: setting
    type: enum
    binding: { holding: 31, encoding: uint16 }
    enum: { 0: none, 1: supply_ch1, 2: supply_ch2, 3: supply_ch3, 4: extract_ch1, 5: extract_ch2, 6: extract_ch3 }
    default: none
    # A commissioning tool should also check the named channel actually
    # reports temperature: its sensor_capability must contain temperature.
    # That is a cross-signal check no expression here can make.
    on_write:
      reread: dependents
      settle_ms: 500
  supply_air_temperature_source:
    title: "Supply Air Temperature Source"
    kind: setting
    type: enum
    binding: { holding: 32, encoding: uint16 }
    enum: { 0: none, 1: supply_ch1, 2: supply_ch2, 3: supply_ch3, 4: extract_ch1, 5: extract_ch2, 6: extract_ch3 }
    default: none
    # A commissioning tool should also check the named channel actually
    # reports temperature: its sensor_capability must contain temperature.
    # That is a cross-signal check no expression here can make.
    on_write:
      reread: dependents
      settle_ms: 500
  extract_air_temperature_source:
    title: "Extract Air Temperature Source"
    kind: setting
    type: enum
    binding: { holding: 33, encoding: uint16 }
    enum: { 0: none, 1: supply_ch1, 2: supply_ch2, 3: supply_ch3, 4: extract_ch1, 5: extract_ch2, 6: extract_ch3 }
    default: none
    # A commissioning tool should also check the named channel actually
    # reports temperature: its sensor_capability must contain temperature.
    # That is a cross-signal check no expression here can make.
    on_write:
      reread: dependents
      settle_ms: 500
  exhaust_air_temperature_source:
    title: "Exhaust Air Temperature Source"
    kind: setting
    type: enum
    binding: { holding: 34, encoding: uint16 }
    enum: { 0: none, 1: supply_ch1, 2: supply_ch2, 3: supply_ch3, 4: extract_ch1, 5: extract_ch2, 6: extract_ch3 }
    default: none
    # A commissioning tool should also check the named channel actually
    # reports temperature: its sensor_capability must contain temperature.
    # That is a cross-signal check no expression here can make.
    on_write:
      reread: dependents
      settle_ms: 500
  outdoor_air_temperature:
    title: "Outdoor Air Temperature"
    kind: measurement
    type: real
    binding: { input: 21, encoding: int16 }
    access: read_only
    unit: "°C"
    scale: 0.1
    decimals: 1
    range: [-40.0, 80.0]
    valid_when: outdoor_air_temperature_source != none
  supply_air_temperature:
    title: "Supply Air Temperature"
    kind: measurement
    type: real
    binding: { input: 22, encoding: int16 }
    access: read_only
    unit: "°C"
    scale: 0.1
    decimals: 1
    range: [-40.0, 80.0]
    valid_when: supply_air_temperature_source != none
  extract_air_temperature:
    title: "Extract Air Temperature"
    kind: measurement
    type: real
    binding: { input: 23, encoding: int16 }
    access: read_only
    unit: "°C"
    scale: 0.1
    decimals: 1
    range: [-40.0, 80.0]
    valid_when: extract_air_temperature_source != none
  exhaust_air_temperature:
    title: "Exhaust Air Temperature"
    kind: measurement
    type: real
    binding: { input: 24, encoding: int16 }
    access: read_only
    unit: "°C"
    scale: 0.1
    decimals: 1
    range: [-40.0, 80.0]
    valid_when: exhaust_air_temperature_source != none
  heat_recovery_efficiency:
    title: "Heat Recovery Efficiency"
    kind: measurement
    type: int
    binding: { input: 25, encoding: uint16 }
    access: read_only
    unit: "%"
    range: [0, 100]
    # (supply - outdoor) / (extract - outdoor). Undefined while any of the
    # three sources is unassigned; the firmware also suppresses it when
    # extract and outdoor are too close together to divide by.
    valid_when: >-
      outdoor_air_temperature_source != none and
      supply_air_temperature_source != none and
      extract_air_temperature_source != none

  # ---------------------------------------------------------------------
  # Pre-heater (hardware option)
  # ---------------------------------------------------------------------

  preheater_installed:
    title: "Pre-heater Installed"
    kind: setting
    type: bool
    binding: { holding: 41, encoding: uint16 }
    labels: { false: not_installed, true: installed }
    default: not_installed
    # The option this whole block hangs off. On a unit without the pre-heater
    # every register below is absent, not merely idle.
    on_write:
      reread: dependents
      settle_ms: 500

  preheater_control_mode:
    title: "Pre-heater Control Mode"
    kind: setting
    type: enum
    binding: { holding: 42, encoding: uint16 }
    enum: { 0: disabled, 1: frost_protection, 2: supply_temperature }
    default: frost_protection
    present_when: preheater_installed == installed
    on_write:
      reread: dependents

  preheater_output_type:
    title: "Pre-heater Output Type"
    kind: setting
    type: enum
    binding: { holding: 43, encoding: uint16 }
    enum: { 0: v0_10, 1: ma0_20, 2: pwm_12v, 3: pwm_open_collector }
    default: v0_10
    present_when: preheater_installed == installed

  preheater_minimum_output_value:
    title: "Pre-heater Minimum Output Value"
    kind: setting
    type: int
    binding: { holding: 44, encoding: uint16 }
    unit: "%"
    range: [0, 50]
    default: 0
    present_when: preheater_installed == installed

  preheater_maximum_output_value:
    title: "Pre-heater Maximum Output Value"
    kind: setting
    type: int
    binding: { holding: 45, encoding: uint16 }
    unit: "%"
    range: [50, 100]
    default: 100
    present_when: preheater_installed == installed

  preheater_frost_protection_setpoint:
    title: "Pre-heater Frost Protection Setpoint"
    kind: setting
    type: real
    binding: { holding: 46, encoding: int16 }
    unit: "°C"
    scale: 0.1
    decimals: 1
    range: [-20.0, 5.0]
    default: -3.0
    present_when: preheater_control_mode == frost_protection

  preheater_supply_temperature_setpoint:
    title: "Pre-heater Supply Temperature Setpoint"
    kind: setting
    type: real
    binding: { holding: 47, encoding: int16 }
    unit: "°C"
    scale: 0.1
    decimals: 1
    range: [5.0, 25.0]
    default: 16.0
    present_when: preheater_control_mode == supply_temperature

  preheater_output_value:
    title: "Pre-heater Output Value"
    kind: measurement
    type: int
    binding: { input: 31, encoding: uint16 }
    access: read_only
    unit: "%"
    range: [0, 100]
    valid_when: preheater_installed == installed

  preheater_fault:
    title: "Pre-heater State: Heater Fault"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 32, encoding: bit, bit: 0 }
    bitfield: "Pre-heater State"
    valid_when: preheater_installed == installed

  preheater_thermal_cutout_open:
    title: "Pre-heater State: Thermal Cutout Open"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 32, encoding: bit, bit: 1 }
    bitfield: "Pre-heater State"
    valid_when: preheater_installed == installed

  preheater_output_saturated:
    title: "Pre-heater State: Output Saturated"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 32, encoding: bit, bit: 2 }
    bitfield: "Pre-heater State"
    valid_when: preheater_installed == installed

  preheater_frost_protection_active:
    title: "Pre-heater State: Frost Protection Active"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 32, encoding: bit, bit: 3 }
    bitfield: "Pre-heater State"
    valid_when: preheater_installed == installed

  # ---------------------------------------------------------------------
  # Heat exchanger bypass (modulating, analog control)
  # ---------------------------------------------------------------------

  bypass_control_mode:
    title: "Bypass Control Mode"
    kind: setting
    type: enum
    binding: { holding: 51, encoding: uint16 }
    enum: { 0: disabled, 1: automatic, 2: manual }
    default: automatic
    on_write:
      reread: dependents
      settle_ms: 500

  bypass_output_type:
    title: "Bypass Output Type"
    kind: setting
    type: enum
    binding: { holding: 52, encoding: uint16 }
    enum: { 0: v0_10, 1: ma0_20, 2: pwm_12v, 3: pwm_open_collector }
    default: v0_10
    present_when: bypass_control_mode != disabled

  bypass_minimum_output_value:
    title: "Bypass Minimum Output Value"
    kind: setting
    type: int
    binding: { holding: 53, encoding: uint16 }
    unit: "%"
    range: [0, 40]
    default: 0
    present_when: bypass_control_mode != disabled
    # The damper's closed end stop, as a percentage of the analog output.

  bypass_maximum_output_value:
    title: "Bypass Maximum Output Value"
    kind: setting
    type: int
    binding: { holding: 54, encoding: uint16 }
    unit: "%"
    range: [60, 100]
    default: 100
    present_when: bypass_control_mode != disabled

  bypass_outdoor_temperature_threshold:
    title: "Bypass Outdoor Temperature Threshold"
    kind: setting
    type: real
    binding: { holding: 55, encoding: int16 }
    unit: "°C"
    scale: 0.1
    decimals: 1
    range: [10.0, 30.0]
    default: 18.0
    present_when: bypass_control_mode == automatic

  bypass_extract_temperature_threshold:
    title: "Bypass Extract Temperature Threshold"
    kind: setting
    type: real
    binding: { holding: 56, encoding: int16 }
    unit: "°C"
    scale: 0.1
    decimals: 1
    range: [18.0, 30.0]
    default: 22.0
    present_when: bypass_control_mode == automatic

  bypass_manual_position:
    title: "Bypass Manual Position"
    kind: setting
    type: int
    binding: { holding: 57, encoding: uint16 }
    unit: "%"
    range: [0, 100]
    step: 5
    default: 0
    present_when: bypass_control_mode == manual

  bypass_position:
    title: "Bypass Position"
    kind: measurement
    type: int
    binding: { input: 41, encoding: uint16 }
    access: read_only
    unit: "%"
    range: [0, 100]
    valid_when: bypass_control_mode != disabled

  bypass_damper_fault:
    title: "Bypass State: Damper Fault"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 42, encoding: bit, bit: 0 }
    bitfield: "Bypass State"
    valid_when: bypass_control_mode != disabled

  bypass_position_feedback_missing:
    title: "Bypass State: Position Feedback Missing"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 42, encoding: bit, bit: 1 }
    bitfield: "Bypass State"
    valid_when: bypass_control_mode != disabled

  bypass_held_closed_by_frost_protection:
    title: "Bypass State: Held Closed By Frost Protection"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 42, encoding: bit, bit: 2 }
    bitfield: "Bypass State"
    valid_when: bypass_control_mode != disabled

  bypass_held_closed_by_missing_temperature:
    title: "Bypass State: Held Closed By Missing Temperature"
    kind: measurement
    type: bool
    access: read_only
    binding: { input: 42, encoding: bit, bit: 3 }
    bitfield: "Bypass State"
    valid_when: bypass_control_mode != disabled

  # ---------------------------------------------------------------------
  # Filter monitoring
  #
  # PROVISIONAL. That filters get monitored is settled; how is not. Both
  # candidate mechanisms are modelled behind filter_monitoring_mode so the
  # decision can be made without reshaping the map -- but differential
  # pressure needs a sensor the current hardware list does not include
  # (the I2C channels measure barometric, not differential, pressure).
  # See DECISIONS.md D7.
  # ---------------------------------------------------------------------

  filter_monitoring_mode:
    title: "Filter Monitoring Mode"
    kind: setting
    type: enum
    binding: { holding: 61, encoding: uint16 }
    enum: { 0: disabled, 1: elapsed_time, 2: differential_pressure }
    default: elapsed_time
    on_write:
      reread: dependents
      settle_ms: 500

  filter_replacement_interval:
    title: "Filter Replacement Interval"
    kind: setting
    type: int
    binding: { holding: 62, encoding: uint16 }
    unit: "days"
    range: [30, 365]
    default: 90
    present_when: filter_monitoring_mode == elapsed_time

  filter_differential_pressure_threshold:
    title: "Filter Differential Pressure Threshold"
    kind: setting
    type: int
    binding: { holding: 63, encoding: uint16 }
    unit: "Pa"
    range: [50, 500]
    default: 200
