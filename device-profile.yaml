  # ---------------------------------------------------------------------
  # Internal properties: no Modbus binding
  #
  # These exist on the device but are not exposed on the bus. They are here
  # because they are persisted or published state with an identity outside
  # the firmware, so the firmware generates them from the same table as
  # everything else instead of maintaining a parallel mechanism (D8).
  #
  # EXAMPLES ONLY -- the real internal list has to come from the firmware
  # author. Two near-universal ones are shown so the shape is visible.
  # ---------------------------------------------------------------------

  supply_fan_calibration_offset:
    title: "Supply Fan Calibration Offset"
    kind: setting
    type: real
    unit: "%"
    range: [-10.0, 10.0]
    scale: 0.1
    decimals: 1
    default: 0.0
    # Written at end of line test, never by an installer. Persisted.

  nvm_write_count:
    title: "NVM Write Count"
    kind: measurement
    type: int
    access: read_only
    unit: "writes"
    range: [0, 4294967295]
    # Wear counter. Published to the firmware's own diagnostics, not to the bus.

  # ---------------------------------------------------------------------
  # Diagnostics (IR501+ in the library convention)
  # ---------------------------------------------------------------------

  mcu_temperature:
    title: "MCU Temperature"
    kind: measurement
    type: real
    binding: { input: 501, encoding: int16 }
    access: read_only
    unit: "°C"
    scale: 0.1
