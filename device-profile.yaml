    on_write:
      reread: dependents
      settle_ms: 500

  extract_ch3_temperature_correction:
    title: "Extract Channel 3 - Temperature Correction Value"
    binding: { holding: 302, type: int16 }
    unit: "°C"
    scale: 0.1
    decimals: 1
    range: [-5.0, 5.0]
    default: 0
    present_when: extract_ch3_sensor_capability contains temperature

  extract_ch3_relative_humidity_correction:
    title: "Extract Channel 3 - Relative Humidity Correction Value"
    binding: { holding: 303, type: int16 }
    unit: "%RH"
    scale: 0.1
    decimals: 1
    range: [-10.0, 10.0]
    default: 0
    present_when: extract_ch3_sensor_capability contains relative_humidity

  extract_ch3_voc_correction:
    title: "Extract Channel 3 - VOC Correction Value"
    binding: { holding: 304, type: int16 }
    unit: "index"
    decimals: 0
    range: [-50, 50]
    default: 0
    present_when: extract_ch3_sensor_capability contains voc

  extract_ch3_carbon_dioxide_correction:
    title: "Extract Channel 3 - Carbon Dioxide Correction Value"
    binding: { holding: 305, type: int16 }
    unit: "ppm"
    decimals: 0
    range: [-200, 200]
    default: 0
    present_when: extract_ch3_sensor_capability contains carbon_dioxide

  extract_ch3_barometric_pressure_correction:
    title: "Extract Channel 3 - Barometric Pressure Correction Value"
    binding: { holding: 306, type: int16 }
    unit: "hPa"
    scale: 0.1
    decimals: 1
    range: [-10.0, 10.0]
    default: 0
    present_when: extract_ch3_sensor_capability contains barometric_pressure

  extract_ch3_carbon_dioxide_alert_1_level:
    title: "Extract Channel 3 - Carbon Dioxide Alert 1 Level"
    binding: { holding: 311, type: uint16 }
    unit: "ppm"
    range: [400, 5000]
    default: 1000
    present_when: extract_ch3_sensor_capability contains carbon_dioxide

  extract_ch3_carbon_dioxide_alert_2_level:
    title: "Extract Channel 3 - Carbon Dioxide Alert 2 Level"
    binding: { holding: 312, type: uint16 }
    unit: "ppm"
    range: [400, 5000]
    default: 1400
    present_when: extract_ch3_sensor_capability contains carbon_dioxide

  extract_ch3_voc_alert_1_level:
    title: "Extract Channel 3 - VOC Alert 1 Level"
    binding: { holding: 313, type: uint16 }
    unit: "index"
    range: [0, 500]
    default: 150
    present_when: extract_ch3_sensor_capability contains voc

  extract_ch3_voc_alert_2_level:
    title: "Extract Channel 3 - VOC Alert 2 Level"
    binding: { holding: 314, type: uint16 }
    unit: "index"
    range: [0, 500]
    default: 300
    present_when: extract_ch3_sensor_capability contains voc

  # ---------------------------------------------------------------------
  # Diagnostics (IR501+ in the library convention)
  # ---------------------------------------------------------------------

  mcu_temperature:
    title: "MCU Temperature"
    binding: { input: 501, type: int16 }
    access: read_only
    unit: "°C"
    scale: 0.1
    decimals: 1

  lifetime_days:
    title: "Lifetime - days"
    binding: { input: 504, type: uint16 }
    access: read_only
    unit: "days"

  lifetime_minutes:
    title: "Lifetime - minutes"
    binding: { input: 505, type: uint16 }
    access: read_only
    unit: "minutes"

  internal_voltage_12v:
    title: "Internal voltage - 12VDC"
    binding: { input: 506, type: uint16 }
    access: read_only
    unit: "VDC"
    scale: 0.1
    decimals: 1

  internal_voltage_3v3:
    title: "Internal voltage - 3.3VDC"
    binding: { input: 507, type: uint16 }
    access: read_only
    unit: "VDC"
    scale: 0.01
    decimals: 2

  device_reset:
    title: "Device Reset"
    binding: { holding: 990, type: uint16 }
    access: write_only
    enum: { 0: idle, 1: reset }
    default: idle

procedures:

  swap_air_chains:
    title: "Swap air chains left to right"
    danger: high
    confirm: "Both fans stop and the unit reverses which physical side is
      supply and which is extract. Ducting, sensors and the digital inputs
      must be re-checked against the new orientation before restarting."
    duration_ms: 5000
    preconditions:
      - operating_mode == standby
      - supply_fan_speed == 0
      - extract_fan_speed == 0
    steps:
      - write: { signal: left_right_swap, value: $param.orientation }
        verify:
          read: left_right_swap
          equals: $param.orientation
          timeout_ms: 2000
      - delay_ms: 1000
      - reread: [supply_digital_input_state, extract_digital_input_state]
    on_failure:
      - write: { signal: operating_mode, value: standby }
    outcome:
      failure: { signal: device_status_errors, contains: sensor_bus_fault }
    params:
      orientation: { enum_from: left_right_swap }

  set_fan_control_source:
    title: "Change fan control source"
    danger: high
    confirm: "The fan stops while the control path changes. An EC fan left on
      the wrong path will not run at all."
    duration_ms: 3000
    preconditions:
      - operating_mode == standby
    steps:
      - write: { signal: supply_fan_control_source, value: $param.source }
        verify:
          read: supply_fan_control_source
          equals: $param.source
          timeout_ms: 1000
      - write: { signal: extract_fan_control_source, value: $param.source }
        verify:
          read: extract_fan_control_source
          equals: $param.source
          timeout_ms: 1000
      - delay_ms: 500
    params:
      source: { enum_from: supply_fan_control_source }

  rescan_sensor_channels:
    title: "Rescan I2C sensor channels"
    danger: medium
    confirm: "Sensor readings are unavailable during the scan. Channels that
      have been physically removed lose their configuration."
    duration_ms: 10000
    steps:
      - write: { signal: sensor_bus_rescan, value: rescan }
      - await:
          signal: sensor_bus_state
          in: [complete, failed]
          timeout_ms: 15000
          poll_ms: 500
      - reread:
          - supply_ch1_sensor_capability
          - supply_ch2_sensor_capability
          - supply_ch3_sensor_capability
          - extract_ch1_sensor_capability
          - extract_ch2_sensor_capability
          - extract_ch3_sensor_capability
    outcome:
      success: { signal: sensor_bus_state, equals: complete }
      failure: { signal: sensor_bus_state, equals: failed }

  commission_fan_limits:
    title: "Set fan output limits"
    danger: medium
    confirm: "Minimum output below the fan's stall threshold will stall it
      instead of running it slowly."
    preconditions:
      - operating_mode == standby
    steps:
      - write: { signal: supply_fan_minimum_output_value, value: $param.minimum }
      - write: { signal: supply_fan_maximum_output_value, value: $param.maximum }
      - write: { signal: extract_fan_minimum_output_value, value: $param.minimum }
      - write: { signal: extract_fan_maximum_output_value, value: $param.maximum }
    params:
      minimum: { type: uint16, range: [20, 60], default: 30, title: "Minimum output" }
      maximum: { type: uint16, range: [60, 100], default: 100, title: "Maximum output" }
